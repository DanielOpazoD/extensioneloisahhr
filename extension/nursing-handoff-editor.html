<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrega de turno · HHR pruebas</title>
  <link rel="stylesheet" href="nursing-handoff-editor.css">
</head>
<body>
  <main>
    <header>
      <h1>Entrega de turno</h1>
      <div class="actions">
        <span>Pruebas HHR</span>
        <button type="button" id="close" class="quiet" aria-label="Cerrar">×</button>
      </div>
    </header>
    <p id="patient"></p>
    <p id="slot" class="detail"></p>
    <form id="edit" hidden>
      <label class="sr-only" for="note">Nota del turno</label>
      <textarea id="note" rows="8" maxlength="16000" placeholder="Escribe la entrega de turno"></textarea>
      <div class="actions">
        <button type="submit">Guardar</button>
      </div>
    </form>
    <div id="conflict" hidden>
      <label for="remote">Nota actual de HHR</label>
      <textarea id="remote" rows="4" readonly></textarea>
      <button type="button" id="keep" class="quiet">Conservar mi edición</button>
      <button type="button" id="use-remote" class="quiet">Usar nota de HHR</button>
    </div>
    <p id="status" role="status"></p>
    <div id="discard" hidden>
      <p>Hay cambios sin guardar.</p>
      <button type="button" id="continue" class="quiet">Seguir editando</button>
      <button type="button" id="confirm-close">Cerrar sin guardar</button>
    </div>
  </main>
  <script src="message-contract.js"></script>
  <script src="nursing-handoff-editor.js"></script>
</body>
</html>
