<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puente Eloísa → HHR</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1e293b;
        background: #f8fafc;
      }

      body {
        width: 300px;
        margin: 0;
      }

      main {
        padding: 18px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      header img {
        width: 34px;
        height: 34px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 14px;
        line-height: 1.25;
      }

      .subtitle {
        margin-top: 2px;
        color: #64748b;
        font-size: 11px;
      }

      .version {
        margin-top: 16px;
        padding: 14px 15px;
        border-left: 4px solid #0f766e;
        background: #ecfdf5;
      }

      .version-label {
        color: #475569;
        font-size: 11px;
      }

      #extension-version {
        display: block;
        margin-top: 2px;
        color: #115e59;
        font-size: 28px;
        font-weight: 750;
        letter-spacing: -0.03em;
      }

      .capability {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        font-size: 12px;
      }

      .capability::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #0f766e;
        content: "";
      }

      .worker-status {
        margin-top: 14px;
        font-size: 12px;
        line-height: 1.5;
      }

      .worker-status[data-state="error"] {
        color: #9a3412;
      }

      nav { display:grid; gap:4px; margin-top:16px; }
      nav a, nav button { box-sizing:border-box; width:100%; padding:9px 10px; line-height:1.35;
        font-family:inherit; font-size:13px; font-weight:600; text-align:left; text-decoration:none;
        border:0; border-radius:5px; background:transparent; color:#215b54; cursor:pointer; }
      nav a:first-child { background:#13665c; color:white; }
      nav a:first-child:hover { background:#104e47; }
      nav a:hover, nav button:hover { background:#e4eeeb; }
      nav :focus-visible { outline:2px solid #bb6203; outline-offset:2px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/hanga-roa-48.png" alt="" />
        <div>
          <h1>Puente Eloísa → HHR</h1>
          <p class="subtitle">Extensión clínica local</p>
        </div>
      </header>

      <section class="version" aria-labelledby="version-label">
        <p id="version-label" class="version-label">Versión que Chrome está usando</p>
        <strong id="extension-version" aria-live="polite">Cargando…</strong>
        <p id="extension-build" class="subtitle" aria-live="polite"></p>
      </section>

      <nav aria-label="Acciones del puente">
        <a href="https://github.com/DanielOpazoD/extensioneloisahhr/releases/latest/download/eloisa-hhr.zip" target="_blank" rel="noreferrer">Descargar actualización (.zip)</a>
        <a href="https://github.com/DanielOpazoD/extensioneloisahhr/blob/main/docs/instalacion/README.md" target="_blank" rel="noreferrer">Guía ilustrada de instalación y actualización</a>
        <button type="button" id="manage-extension">Deshabilitar en Chrome…</button>
      </nav>
      <p id="manage-error" class="worker-status" role="status" hidden></p>

      <p class="capability">Gestor documental incluido</p>
      <p id="worker-status" class="worker-status" role="status" aria-live="polite">Comprobando conexión interna…</p>
    </main>
    <script src="build-identity.js"></script>
    <script src="extension-status.js"></script>
    <script src="extension-worker-status.js"></script>
  </body>
</html>
