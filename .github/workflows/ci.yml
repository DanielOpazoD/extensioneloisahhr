name: Extension CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: extension-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  extension-ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
      - name: Check updated base and release number
        if: github.event_name == 'pull_request'
        run: npm run check:version
        env:
          CI_GIT_ROOT: ${{ github.workspace }}
          CI_EXTENSION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_EXTENSION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - run: npm ci
      - run: npm test
      - run: npm run check:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:runtime
      - name: Verify keyboard and layout in the compact desktop summary
        run: node scripts/capture-medical-round.mjs WORKTREE "$RUNNER_TEMP/ficha-escritorio" lectura
      - name: Verify long admissions, bedside columns and full prescriptions
        run: node scripts/capture-medical-round.mjs WORKTREE "$RUNNER_TEMP/ficha-ingreso" ingreso
      - name: Verify the compact history timeline and its notes by professional
        run: node scripts/capture-history.mjs WORKTREE "$RUNNER_TEMP/ficha-historial"
      - name: Verify the compact treatment plan keeps hours, states and native names
        run: node scripts/capture-care-plan.mjs WORKTREE "$RUNNER_TEMP/ficha-plan"
      - name: Verify Alta and Ejecución de cuidados read like the summary
        run: node scripts/capture-other-views.mjs WORKTREE "$RUNNER_TEMP/ficha-vistas"
      - name: Verify the compact summary on the shapes Eloísa draws
        run: node scripts/capture-summary.mjs WORKTREE "$RUNNER_TEMP/ficha-resumen"
      - name: Compare the captures with the base, for review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/capture-diff.mjs "${{ github.event.pull_request.base.sha }}" "$RUNNER_TEMP" "$RUNNER_TEMP/capturas-diferencias"
      - name: Keep the differences
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: capturas-diferencias
          path: ${{ runner.temp }}/capturas-diferencias
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify the medical worklist reads like the care worklist
        run: node scripts/capture-medical-worklist.mjs WORKTREE "$RUNNER_TEMP/lista-medica"
      - name: Verify the reader of evolutions on the summary
        run: node scripts/capture-evolution-reader.mjs WORKTREE "$RUNNER_TEMP/lector-evoluciones"
      - name: Verify the summary arrives in the compact view while it loads
        run: node scripts/capture-loading.mjs WORKTREE "$RUNNER_TEMP/ficha-carga"
      - name: Verify a change of module reads as one page
        run: node scripts/capture-transitions.mjs WORKTREE "$RUNNER_TEMP/ficha-transiciones"
      - run: npm run test:dau
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: extension-candidate
          path: dist/
          if-no-files-found: error
